name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false      # a failure on one Python must not hide the result on the other
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install --require-hashes -r backend/requirements.lock
      - run: .venv/bin/ruff check backend/spectra backend/tests
      - run: cd backend && ../.venv/bin/python -m pytest -q
      - run: cd backend && SPECTRA_DATA_DIR=$(mktemp -d) ../.venv/bin/python scripts/check_readme_counts.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv && uv pip install --require-hashes -r backend/requirements.lock
      - run: .venv/bin/pip-audit -r backend/requirements.lock --disable-pip --no-deps
      # licence allowlist (security/license-policy.json): fails on an unknown or
      # copyleft licence with no exception; a *pending* exception is printed
      - run: .venv/bin/python backend/scripts/check_licenses.py --frontend --json license-report.json
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # custom rule: no packet-payload access outside backend/spectra/parse/
      # (the rule is tested against annotated fixtures, then run as a gate)
      - run: uvx semgrep@1.184.0 --metrics=off --test security/semgrep
      - run: >-
          uvx semgrep@1.184.0 --metrics=off --config security/semgrep/spectra-payload.yml
          --error --exclude backend/spectra/parse --exclude backend/spectra/demo.py backend/spectra
      # general rule packs: reported, not gating (see docs/sast-report.md for the triage)
      - run: >-
          uvx semgrep@1.184.0 --metrics=off --config p/python --config p/owasp-top-ten
          --json -o semgrep-registry.json backend/spectra backend/scripts
      # Bandit: HIGH severity gates; the triaged Medium/Low report is kept as an artifact
      - run: uvx bandit@1.9.4 -r backend/spectra backend/scripts -lll
      - run: uvx bandit@1.9.4 -r backend/spectra backend/scripts -f json -o bandit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: |
            semgrep-registry.json
            bandit.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # production dependencies must be clean; no high/critical anywhere
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=high
  package:
    # builds the release wheel with the dashboard inside, installs it into a clean
    # virtualenv on two Pythons and exercises the real server (docs/runbook.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - run: scripts/build_release.sh
      - run: python3 scripts/smoke_install.py backend/dist/spectra-*.whl --python 3.13
      - run: python3 scripts/smoke_install.py backend/dist/spectra-*.whl --python 3.11
      # SBOMs: the runtime Python environment (wheel + its dependencies only) and the
      # frontend production tree
      - run: |
          uv venv --python 3.13 .sbom-venv
          uv pip install --python .sbom-venv/bin/python backend/dist/spectra-*.whl
          uvx --from cyclonedx-bom cyclonedx-py environment .sbom-venv/bin/python --of JSON -o sbom-python-runtime.cdx.json
          (cd frontend && npm sbom --sbom-format cyclonedx --omit dev > ../sbom-frontend.cdx.json)
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel-and-sbom
          path: |
            backend/dist/*.whl
            sbom-python-runtime.cdx.json
            sbom-frontend.cdx.json
