name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python ${{ matrix.python }} .venv
      - run: uv pip install --require-hashes -r backend/requirements.lock
      - run: .venv/bin/ruff check backend/spectra backend/tests
      - run: cd backend && ../.venv/bin/python -m pytest -q
      - run: cd backend && SPECTRA_DATA_DIR=$(mktemp -d) ../.venv/bin/python scripts/check_readme_counts.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv && uv pip install --require-hashes -r backend/requirements.lock
      - run: .venv/bin/pip-audit -r backend/requirements.lock --disable-pip --no-deps
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
