name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: checkboxes
    id: rules
    attributes:
      label: Project rules
      options:
        - label: This does not need Spectra to read, decrypt or store packet payload (docs/project-rules.md §2.1)
          required: true
