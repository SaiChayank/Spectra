# docker compose up -d                       -> API + dashboard on http://127.0.0.1:8000, data in the `spectra-data` volume
# docker compose --profile capture up -d     -> additionally a live-capture node (needs host networking + NET_RAW)
x-spectra: &spectra
  image: spectra:1.0.0
  build: .
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  volumes: [spectra-data:/data]

services:
  api:
    <<: *spectra
    ports: ["127.0.0.1:${SPECTRA_PORT:-8000}:8000"]       # put a TLS reverse proxy in front before exposing it

  # Opt-in. Only this service gets NET_RAW; it sees the host's interfaces, so run it on the sensor host.
  capture:
    <<: *spectra
    profiles: [capture]
    network_mode: host
    cap_add: [NET_RAW]
    command: ["serve", "--host", "127.0.0.1", "--port", "8001"]
    user: "10001"
    volumes: [spectra-capture-data:/data]   # its own instance: never share one SQLite DB between two servers

volumes:
  spectra-data:
  spectra-capture-data:
